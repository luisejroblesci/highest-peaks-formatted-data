name: ci tests
discover: npx jest --listTests
run: |
  mkdir -p test-reports
  JEST_JUNIT_OUTPUT_FILE="<< outputs.junit >>" JEST_JUNIT_CLASSNAME="{filepath}" \
  npx jest --reporters=default --reporters=jest-junit --bail << test.atoms >>
analysis: |
  CIRCLECI_COVERAGE="<< outputs.circleci-coverage >>" npx jest \
    --runInBand --silent --bail << test.atoms >>
outputs:
  junit: test-reports/junit.xml
options:
  test-impact-analysis: true
