version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          paths:
            - node_modules
          key: v1-deps-{{ checksum "package-lock.json" }}
      - run:
          name: Run tests
          command: |
            mkdir -p test-reports
            JEST_JUNIT_OUTPUT_FILE=test-reports/junit.xml npx react-scripts test --runInBand --reporters=default --reporters=jest-junit --watchAll=false
      - store_test_results:
          path: test-reports

workflows:
  test-workflow:
    jobs:
      - test
